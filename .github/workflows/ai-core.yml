name: AI terrain core

on:
  push:
    branches: [feature/ai-terrain-assistant]
  pull_request:
    paths:
      - 'WorldPainter/WPCore/**'
      - 'WorldPainter/WPGUI/**'
      - 'WorldPainter/WPAIHeadlessTests/**'
      - 'WorldPainter/pom.xml'
      - '.github/workflows/ai-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Register WorldPainter JDK toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <toolchains><toolchain><type>jdk</type><provides><version>17</version></provides><configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration></toolchain></toolchains>
          EOF
      - name: Test full desktop, docking and AI workflows
        run: xvfb-run -a -s '-screen 0 1920x1200x24' mvn -B -f WorldPainter/pom.xml -pl WPGUI -am -Djava.awt.headless=false -Dworldpainter.captureScreenshots=true verify
      - name: Upload native editor screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-screenshots
          path: WorldPainter/WPGUI/target/workspace-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 14
