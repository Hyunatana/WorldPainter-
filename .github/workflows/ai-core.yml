name: AI terrain core

on:
  push:
    branches: [feature/ai-terrain-assistant]
  pull_request:
    paths:
      - 'WorldPainter/WPCore/**'
      - 'WorldPainter/WPGUI/src/main/java/org/pepsoft/worldpainter/ai/**'
      - 'WorldPainter/WPGUI/src/test/java/org/pepsoft/worldpainter/ai/**'
      - 'WorldPainter/WPAIHeadlessTests/**'
      - 'WorldPainter/pom.xml'
      - '.github/workflows/ai-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Register WorldPainter JDK toolchain
        shell: bash
        run: |
          mkdir -p "$HOME/.m2"
          cat > "$HOME/.m2/toolchains.xml" <<EOF
          <toolchains><toolchain><type>jdk</type><provides><version>17</version></provides><configuration><jdkHome>${JAVA_HOME}</jdkHome></configuration></toolchain></toolchains>
          EOF
      - name: Test core and real Swing assistant without licensed docking dependencies
        run: mvn -B -f WorldPainter/pom.xml -Pai-tests -pl WPAIHeadlessTests -am -Djava.awt.headless=true verify
